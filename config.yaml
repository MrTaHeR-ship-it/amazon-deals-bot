# إعدادات بوت عروض أمازون — مفيش هنا أي حاجة سرية، الأسرار في GitHub Secrets

store:
  marketplace: www.amazon.eg
  partner_tag: tahergalaleld-21
  # لغة أسماء المنتجات من الـ API، سيبها فاضية عشان أمازون تختار
  language: ""

posting:
  timezone: Africa/Cairo
  # النشر من الساعة 10 الصبح لحد 1 بالليل (بتوقيت القاهرة)
  active_from: 10
  active_to: 1
  # أقل وقت بين بوست والتاني بالدقايق (18 دقيقة = حوالي 50 بوست من 10 الصبح لـ 1 بالليل)
  min_gap_minutes: 18
  # أقصى عدد بوستات في اليوم (البوستات اللي بتبعتها بـ /now مش بتتحسب)
  max_posts_per_day: 50
  signature: "تابعنا على كل المنصات: @mr.taher.reviews"
  # حساباتك: اللينكات والمنشنات اللي فيها الكلمات دي مش بتتشال من الرسائل
  own_handles: [mr.taher.reviews, taherreviews, mrtaher, tahertech]
  # لينكات غير أمازون في الرسائل المحولة (نون، لينكات حد تاني...): false = تتشال
  keep_other_links: false
  # زرار "شير على واتساب" تحت كل بوست (ليك وللمتابعين)
  whatsapp_button: true

inbox:
  # الرسائل اللي فيها كلام ولينكات (زي رسائل الجروب اللي بتعملها forward):
  # offer = تنزل بقالب العروض (السعر والخصم بالجنيه والنسبة) — raw = تنزل زي ما هي بلينكاتك
  # rich = كل منتج ياخد بوست بالسعر من أمازون (محتاج الـ API)
  text_messages: offer
  # لما تبعت لينك فيه عروض كتير (بحث أو قسم)، أقصى عدد منتجات ياخدها منه
  max_from_page: 8
  # أقل نسبة خصم للمنتجات اللي بتتسحب من لينك فيه عروض كتير
  min_saving_percent: 10

sources:
  # قنوات تليجرام Public البوت بياخد منها العروض، ويحوّل لينكاتها للتاج بتاعك
  enabled: true
  channels:
    - HotDealsAQ
    - TechComics
    - amdaata
    - yahiaashry2026
  # قنوات بتحط صورة المنتج جوه تصميم عليه اللوجو بتاعها: البوت بياخد صورة المنتج بس
  # ولو ملقاش صورة المنتج بينزل البوست من غير صورة، عشان اللوجو مايظهرش
  crop_card:
    - HotDealsAQ
  # البوت بيقرا القنوات كل كام دقيقة
  check_every_minutes: 10
  # أول مرة يقرا فيها قناة: ياخد آخر كام بوست بس
  first_run_take: 2
  # أقصى عدد بوستات جديدة ياخدها من القناة في المرة
  max_new_per_channel: 20
  # أقصى عدد عروض من القنوات تستنى في الطابور (بيحتفظ بأعلى خصم)
  max_queue: 60
  # العرض اللي عدّى عليه الوقت ده من غير ما ينزل بيتشال (العروض بتخلص بسرعة)
  max_age_hours: 8
  # أقل نسبة خصم عشان العرض ياخد مكان في الطابور، 0 = أي عرض
  min_discount_percent: 0
  # ميعيدش نفس المنتج قبل كام يوم
  repost_after_days: 7

auto:
  # البحث الأوتوماتيك عن العروض (بيشتغل بس لو الـ Creators API مفتوح)
  enabled: true
  every_hours: 3
  min_saving_percent: 20
  # أقل تقييم للمنتج (من 1 لـ 4)، 0 = من غير فلتر
  min_rating: 4
  # أقل سعر بالجنيه عشان نبعد عن الحاجات الرخيصة أوي
  min_price_egp: 150
  # كام عرض جديد يتضاف للطابور في كل جولة بحث
  max_new_per_round: 4
  # ميعيدش نفس المنتج قبل كام يوم (إلا لو سعره نزل 5% أو أكتر)
  repost_after_days: 7
  # الكلمات اللي بيدور بيها — زود أو شيل براحتك
  searches:
    - keywords: smartphone
    - keywords: wireless earbuds
    - keywords: power bank
    - keywords: smart watch
    - keywords: fast charger
    - keywords: laptop
    - keywords: gaming headset
    - keywords: tablet
